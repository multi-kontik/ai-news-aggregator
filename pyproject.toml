[project]
name = "ai-news-aggregator"
version = "0.1.0"
description = "Aggregates AI news from YouTube, OpenAI and Anthropic into a ranked daily email digest"
readme = "README.md"
authors = [
    { name = "multi-kontik", email = "bayaraa.battsengel@mail.utoronto.ca" }
]
requires-python = ">=3.13"
dependencies = [
    "docling>=2.124.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "openai>=2.53.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "resend>=2.35.0",
    "sqlalchemy>=2.0.51",
    # Required by docling. Listed directly so the CPU-only source below applies,
    # and pinned so macOS and the Linux server run the same version.
    "torch==2.13.0",
    "torchvision==0.28.0",
    "typer>=0.12.5,<0.27.0",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
ai-news = "app.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
]

# docling needs PyTorch. On Linux (the server image), take the CPU-only build:
# PyPI's default Linux wheel bundles CUDA and several GB of NVIDIA libraries
# that a CPU-only server never uses. macOS keeps the regular PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
